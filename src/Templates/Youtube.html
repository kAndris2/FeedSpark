<!DOCTYPE html>

<body style="margin:0; padding:0; background-color:#0f172a; font-family:Arial, sans-serif;">

            <td align="center" style="padding:24px 8px;">

                                                </td>

                                                <td valign="top">
                                                    <div style="font-size:15px; font-weight:bold; color:#e5e7eb;">

                                                    <div style="margin-top:8px;">
                                                        <a href="<?= channel.url ?>" style="text-decoration:none;">
                                                            <img src="<?= channel.bannerUrl ?>" width="100%" style="border-radius:8px; border:1px solid #1f2937; display:block;">
                                                        </a>
                                                    </div>

                                                    <div style="margin-top:8px; font-size:12px; color:#9ca3af;">
                                                        New videos: <?= channel.videos.length ?>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>

                                    <div>

                                                        <td width="180" valign="top" style="padding:10px;">
                                                            <a href="<?= video.url ?>" style="text-decoration:none;">
                                                                <img src="<?= video.thumbnailUrl ?>" width="160" style="border-radius:8px; border:1px solid #111827; display:block;">
                                                            </a>
                                                        </td>

                                                        <td valign="top" style="padding:10px 14px 10px 0;">
                                                            <div style="font-size:14px; font-weight:bold; color:#e5e7eb; margin-bottom:4px;">
                                                                <a href="<?= video.url ?>" style="color:#e5e7eb; text-decoration:none;">
                                                                    <?= video.title ?>
                                                                </a>
                                                            </div>

                                                            <div style="font-size:11px; color:#9ca3af; margin-bottom:6px;">
                                                                Uploaded: <?= video.publishedDateStr ?>
                                                                <span style="display:inline-block; margin-left:4px; padding:2px 6px; border-radius:999px; background-color:#0f172a; color:#6ee7b7;">
                                                                    <?= video.views ?> views
                                                                </span>
                                                            </div>

                                                            <div style="font-size:12px; color:#9ca3af; line-height:1.5; max-height:3.6em; overflow:hidden;">
                                                                <?= video.description ?>
                                                            </div>

                                                            <div style="margin-top:10px;">
                                                                <a href="<?= video.url ?>" style="display:inline-block; padding:6px 10px; font-size:11px; font-weight:bold; color:#0f172a; background:linear-gradient(135deg,#22c55e,#0ea5e9); border-radius:999px; text-decoration:none;">
                                                                    Watch now
                                                                </a>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        <? } ?>
                                    </div>
                                </div>
                            </td>
                        </tr>

                    <tr>
