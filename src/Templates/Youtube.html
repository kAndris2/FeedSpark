<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<body style="margin:0;padding:0;background:#0f172a;font-family:Arial,sans-serif;">
    <table width="100%" cellspacing="0" cellpadding="0" style="background:#0f172a;">
        <tr>
            <td align="center" style="padding:24px 8px;">
                <table cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;background:#020617;border-radius:16px;border:1px solid #1e293b;">
                    <tr>
                        <td style="padding:20px 24px;border-bottom:1px solid #1e293b;">
                            <div style="color:#e5e7eb;font-size:20px;font-weight:bold;">
                                YouTube summary (<?= summary.topic ?>)
                            </div>
                            <div style="color:#9ca3af;font-size:12px;margin-top:4px;">
                                Period: <?= summary.periodStartStr ?> - <?= summary.periodEndStr ?>
                            </div>
                        </td>
                    </tr>

                    <? for (let channel of summary.channels) { ?>
                        <tr>
                            <td style="padding:20px 24px;border-bottom:1px solid #1e293b;">

                                <a href="<?= channel.url ?>" style="display:block;text-decoration:none;color:inherit;">
                                    <table width="100%" cellspacing="0">
                                        <tr>
                                            <td width="48" valign="top" style="padding-right:12px;">
                                                <img src="<?= channel.avatarUrl ?>" width="48" height="48" style="border-radius:999px;border:1px solid #1f2937;display:block;">
                                            </td>

                                            <td valign="top">
                                                <div style="font-size:15px;font-weight:bold;color:#e5e7eb;">
                                                    <?= channel.name ?>
                                                </div>

                                                <div style="margin-top:8px;">
                                                    <img src="<?= channel.bannerUrl ?>" width="100%" style="border-radius:8px;border:1px solid #1f2937;display:block;">
                                                </div>

                                                <div style="margin-top:8px;font-size:12px;color:#9ca3af;">
                                                    New videos: <?= channel.videos.length ?>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </a>

                                <? for (let video of channel.videos) { ?>
                                    <div style="margin-top:16px;">
                                        <a href="<?= video.url ?>" style="display:block;text-decoration:none;color:inherit;">
                                            <table width="100%" cellspacing="0" cellpadding="0" style="border-radius:12px;border:1px solid #1f2937;background:#020617;">
                                                <tr>
                                                    <td width="180" valign="top" style="padding:10px;">
                                                        <img src="<?= video.thumbnailUrl ?>" width="160" style="border-radius:8px;border:1px solid #111827;display:block;">
                                                    </td>

                                                    <td valign="top" style="padding:10px 14px 10px 0;">
                                                        <div style="font-size:14px;font-weight:bold;color:#e5e7eb;margin-bottom:4px;">
                                                            <?= video.title ?>
                                                        </div>

                                                        <div style="font-size:11px;color:#9ca3af;margin-bottom:6px;">
                                                            Uploaded: <?= video.publishedDateStr ?>
                                                            <span style="display:inline-block;margin-left:4px;padding:2px 6px;border-radius:999px;background:#0f172a;color:#6ee7b7;">
                                                                <?= video.views ?> views
                                                            </span>
                                                        </div>

                                                        <div style="font-size:12px;color:#9ca3af;line-height:1.5;max-height:4.2em;overflow:hidden;">
                                                            <?= video.description ?>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </a>
                                    </div>
                                <? } ?>

                            </td>
                        </tr>
                    <? } ?>

                    <tr>
                        <td style="padding:16px 24px 20px;border-top:1px solid #1e293b;">
                            <div style="font-size:11px;color:#6b7280;text-align:center;line-height:1.5;">
                                This summary was generated by FeedSpark based on the channels you follow.<br>
                                If you no longer wish to receive these emails, please adjust the script settings.
                            </div>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
